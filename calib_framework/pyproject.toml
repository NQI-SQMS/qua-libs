[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "calib_framework"
version = "0.1.0"
description = "Autonomous SC qubit calibration via sequential Bayesian inference"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "networkx>=3.0",
    "matplotlib>=3.7",
    "filelock>=3.12",
]

[project.optional-dependencies]
causal = ["causal-learn>=0.1.3"]
qualibrate = ["qualibrate>=0.1.0", "quam>=0.3.0"]
dev = ["pytest>=7.0", "pytest-cov", "ruff"]
all = ["calib_framework[causal,qualibrate,dev]"]

[tool.setuptools.packages.find]
where = ["."]
include = ["calib_framework*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
